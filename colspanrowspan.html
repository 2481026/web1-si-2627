<!DOCTYPE html>
<html lang="en">
<head>
    <title>Colspan and Rowspan</title>
</head>
<body>
    <table border="1">
    <tr>
        <td rowspan="1">1 <br>5</td>
        <td>2</td>
        <td>3</td>
        <td rowspan="3">4<br>8<br>12</td>
    </tr>

    <tr>
        <td colspan="2" rowspan="2">6 7 <br>10 11</td>
    </tr>

    <tr>
        <td>9</td>
    </tr>

    <tr>
        <td>13</td>
        <td>14</td>
        <td colspan="2">15 16</td>
    </tr>
    </table>
</body>
</html>
